<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mesAñoSegun</title>
</head>
<body>
    <h1>Determinar el mes del año segun un numero del 1 al 12</h1>
    <form class="formulario" onsubmit="mostrarResultado(event)">
        <label for="mes">Ingresa un numero del 1 al 12</label>
        <input type="number" id="mes" name="mes" required>
        <button type="submit">Calcular</button>
        <button type="reset">Borrar</button>
    </form>
    <div id="resultado" class="result"></div>
    

    <script>
        function mostrarResultado(event){
            event.preventDefault();
            const mes = parseInt(document.getElementById('mes').value);
            const resultado = mesAño(mes);
            document.getElementById('resultado').textContent = resultado;
        }

        function mesAño(mes){
            switch (mes){
                case 1:
                    return"Enero";
                    break;
                case 2: 
                    return"Febrero";
                    break;
                case 3:
                    return"Marzo";
                    break;
                case 4:
                    return"Abril";
                    break;
                case 5:
                    return"Mayo";
                    break;
                case 6:
                    return"Junio";
                    break;
                case 7:
                    return"Julio";
                    break;
                case 8:
                    return"Agosto";
                    break;
                case 9:
                    return"Septiembre";
                    break;
                case 10:
                    return"Octubre";
                    break;
                case 11:
                    return"Noviembre";
                   break;
                case 12:
                    return"Diciembre";
                    break;    
                default:
                    return"Numero invalido"
                      }
        }
    </script>
</body>
</html>
