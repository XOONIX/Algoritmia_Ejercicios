<!DOCTYPE html>
<html lang="es">
<head>
    <!--Johnny Fabian Cardozo Montenegro-->
    <!--Nombre: Asignar Código de Acceso según Rol-->
    <!--Entrada: num (como variable)-->
    <!--Salida: Dependiendo el valor escogido, arroja un código-->
    <!--Proceso: Segun num asigna un mensaje con el código-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Código de Acceso</title>
</head>
<body>
    <h1>Asignar Código de Acceso según Rol</h1>
    <!--Formulario base-->
    <form class="formulario" onsubmit="mostrarResultado(event)">
        <label for="rol">¿Cuál es tu rol? (Elige un número del menú)</label><br><br>
        <p>1 = Admin</p>
        <p>2 = Invitado</p>
        <p>3 = Cliente</p>
        <p>4 = Vendedor</p>
        <p>5 = Salir</p>

        <input type="number" id="rol" name="rol" required>
        <button type="submit">Enviar</button>
        <button type="reset">Borrar</button>
    </form>

    <!--Espacio para mostrar el resultado-->
    <div id="resultado" class="result"></div>

    <script>
        function mostrarResultado(event) {
            event.preventDefault();
            const num = parseInt(document.getElementById('rol').value);
            const resultado = asignarCodigo(num);
            document.getElementById('resultado').textContent = resultado;
        }

        function asignarCodigo(num) {
            switch (num) {
                case 1: return "Admin - Tu código es 155";
                case 2: return "Invitado - Tu código es 200";
                case 3: return "Cliente - Tu código es 305";
                case 4: return "Vendedor - Tu código es 807";
                case 5: return "Salir - Tu código es 760";
                default: return "Valor no válido";
            }
        }
    </script>
</body>
</html>
