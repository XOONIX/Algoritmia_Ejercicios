<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TipoTriangulo</title>
</head>
<body>
    <h1>Determinar el tipo de triangulo segun sus lados</h1>
    
    <script>
        let lado1 = prompt("Escribe el primer lado:")
        let lado2 = prompt("Escribe el segundo lado: ")
        let lado3 = prompt("Escribe el tercer lado: ")
        let tipo=0

        if (lado1==lado2 && lado1==lado3){
            tipo=1 
        }
        else if (lado1== lado2 && lado2 != lado3 || lado1 == lado3 && lado2 !=lado1 || lado2 ==lado3 && lado3 !=lado1){
            tipo=2
        }
        else{
            tipo=3
        }

        switch (tipo){
            case 1: 
                alert("El triangulo es Equilatero") ;
                break;
            case 2:
                alert("El triangulo es Isosceles") ;
                break;
            case 3:
                alert("El triangulo es Escaleno") ; 
                break;
        }
    </script>
    
</body>
</html>
