<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tipo de triángulo</title>
    <!--Johnny Fabian Cardozo Montenegro 
    //Nombre:Tipo de triangulo
    //Entrada:lado1;Primer lado del triangulo, lado2;Segundo lado del triangulo, lado3;Tercer lado del triangulo
    //Salida:El triagulo es;(Equilatero, Isosceles o Escaleno)
    //Proceso:Ingresa tres valores, uno para cada uno de sus lados, dependiendo la dimetro de estos, compara y arroja el resultado pre-establecido
    -->
</head>

<body>

    <h1>Tipo de triángulo </h1>

    <form class="form-group" onsubmit="mostrarResultado(event)">
      <label for="lado1">Lado 1:</label>
      <input type="number" id="lado1" name="lado1" required>
      <label for="lado2">Lado 2:</label>
      <input type="number" id="lado2" name="lado2" required>
      <label for="lado3">Lado 3:</label>
      <input type="number" id="lado3" name="lado3" required>
      <button type="submit">Calcular</button>
    </form>
    <div id="resultado" class="result"></div>

  <script>
    // Función para mostrar el resultado en la página
    function mostrarResultado(event) {
      event.preventDefault();
      const lado1 = parseFloat(document.getElementById('lado1').value);
      const lado2 = parseFloat(document.getElementById('lado2').value);
      const lado3 = parseFloat(document.getElementById('lado3').value);
      const resultado = tipoTriangulo(lado1, lado2, lado3);
      document.getElementById('resultado').textContent = resultado;
    }

    // Función para determinar el tipo de triángulo
    function tipoTriangulo(lado1, lado2, lado3) {
      if (lado1 == lado2 && lado2 == lado3) {
        return "El triángulo es equilátero.";
      } else if (lado1 == lado2 || lado2 == lado3 || lado1 == lado3) {
        return "El triángulo es isósceles.";
      } else {
        return "El triángulo es escaleno.";
      }
    }
  </script>
</body>
</html>
